name: build

# 推 main / 提 PR —— 只出 artifact（保留 30 天），不发 Release
# 打 v* 标签 —— 自动出 Release，**中英各一个**：
#     v1.4.2       → 中文版，附件 文献妙妙小工具-v1.4.2.zip
#     v1.4.2-en    → English, 附件 MiaomiaoTool-v1.4.2-en.zip
# 两个 Release 功能完全相同，差别是**语言**：中文版用 源码/ 构建，英文版用 源码/en/ 构建
# （界面、日志、报错、导出表头、默认目录名全英文）。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # Windows runner 的控制台不是 UTF-8，Python 一 print 中文路径就抛
    # UnicodeEncodeError: 'charmap' codec can't encode —— 前几次失败其实都是这个。
    # PYTHONUTF8=1 打开 Python 的 UTF-8 模式，stdout/stderr 一律按 UTF-8 输出。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 源码/requirements.txt

      # 顺带把中文目录「源码/」复制成纯英文的 src/，后续步骤一律走 src（双保险）。
      - name: 准备英文路径
        shell: pwsh
        run: |
          python -c "import os;print('cwd:',ascii(sorted(os.listdir('.')))[:300])"
          python -c "import glob,shutil,os;fs=glob.glob('*/paperfetch.py');print('found',len(fs));assert fs,'paperfetch.py not found';d=os.path.dirname(fs[0]);shutil.copytree(d,'src');print('src items:',len(os.listdir('src')))"

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt pyinstaller

      - name: 判断语言（tag 以 -en 结尾即英文版）
        id: lang
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '-en$') {
            "lang=en" >> $env:GITHUB_OUTPUT
          } else {
            "lang=zh" >> $env:GITHUB_OUTPUT
          }

      - name: 打包 exe（中文版）
        if: steps.lang.outputs.lang == 'zh'
        shell: bash
        working-directory: src
        # 注意：--add-data 在 Windows 上用分号分隔（Linux 是冒号）
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name MiaomiaoTool --icon app.ico --add-data "ui.html;."
          --hidden-import webview.platforms.edgechromium
          --hidden-import webview.platforms.winforms
          --hidden-import clr_loader --hidden-import pythonnet
          --collect-submodules pypdf --collect-submodules fontTools
          desktop.py

      - name: 打包 exe（英文版）
        if: steps.lang.outputs.lang == 'en'
        shell: bash
        working-directory: src/en
        # 英文版是独立构建：源码在 源码/en/，界面/日志/报错全英文
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name MiaomiaoTool --icon ../app.ico --add-data "ui.html;."
          --hidden-import webview.platforms.edgechromium
          --hidden-import webview.platforms.winforms
          --hidden-import clr_loader --hidden-import pythonnet
          --collect-submodules pypdf --collect-submodules fontTools
          desktop.py

      - name: 组装发布包
        shell: bash
        # 用 Python 打包：Compress-Archive 对中文文件名按系统代码页写，容易乱码
        run: python src/pack_release.py ${{ steps.lang.outputs.lang }} ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.lang.outputs.lang }}
          path: "*.zip"
          retention-days: 30

      # ---------------- 中文版 Release ----------------
      - name: 发布 Release（中文）
        if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-en')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
          body: |
            ## 怎么用

            1. 下载下面的 zip，解压到 **D / E / F 盘**（别放 C 盘，程序会存不少 PDF）
            2. 解压后是 `文献妙妙小工具.exe` + `config.json`
            3. 用记事本打开 `config.json`，把 `"email"` 填成你自己的邮箱（**必填**，不填下载会全部失败）
            4. 双击 `文献妙妙小工具.exe`

            > exe 没有数字签名，第一次运行 SmartScreen 会提示"已保护你的电脑"
            > → 点「更多信息」→「仍要运行」。

            详细说明见包里的 `使用说明.pdf`（21 页），源码说明在 `docs\源码说明.pdf`。

            **English version**: 见 releases 页面里带 `-en` 的 tag。

      # ---------------- English Release ----------------
      - name: Publish Release (English)
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '-en')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
          make_latest: false          # 「Latest」留给中文主版本
          body: |
            ## Quick start

            1. Download the zip below and extract it to drive **D / E / F** (avoid C: — the tool stores a lot of PDFs)
            2. You will get `MiaomiaoTool.exe` and `config.json`
            3. Open `config.json` in Notepad and set `"email"` to your own address (**required**; without it every download fails)
            4. Double-click `MiaomiaoTool.exe`

            > The exe is not code-signed. Windows SmartScreen will warn you the first time:
            > click **More info** → **Run anyway**.

            **Note**: this release is **fully English** — window title, buttons, tabs, logs,
            error messages, Excel column headers, the to-download list and the default folder
            names (`library\`, `export\`, `to-download.html`) are all English. The Chinese
            build is the release without the `-en` tag; the two share the same code and features.

            Full guide: `User-Guide-EN.pdf` (19 pages). Source notes: `docs\Source-NOTES-EN.pdf`.

            **中文版**: 见 releases 页面里不带 `-en` 的 tag。
